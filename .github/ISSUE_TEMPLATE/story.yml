# GH-03 스토리 이슈 폼 (V1-T01 스토리 템플릿과 같은 필드)
name: "스토리"
description: "DF-NNN 스토리. PRD 추적 ID와 검증 가능한 수용 기준이 필수다."
title: "[DF-NNN] "
labels: ["type/story"]
body:
  - type: markdown
    attributes:
      value: |
        스토리 정본은 `docs/v1/backlog/<단계>.md`와 `tool/backlog/issues.json`(생성물)입니다. 폼으로 만든 이슈도 같은 PR로 문서에 반영하고 `node tool/backlog/build_issues.mjs`로 JSON을 다시 만들어야 합니다.
        제목은 `[DF-NNN] 동사형 제목`. 라벨(phase/, area/, prio/, size/, flag/, agent/, 위험 라벨)은 소유자가 아래 값에 맞춰 붙입니다.
        **실데이터·비밀·개인정보가 들어간 스크린샷을 올리지 마세요.**
  - type: input
    id: key
    attributes:
      label: "스토리 키"
      description: "대역: P0 DF-001~099, P1a DF-100~199, P1b DF-200~299, P2 DF-300~379, P3 DF-380~449, V2 DF-500~549"
      placeholder: "DF-116"
    validations:
      required: true
  - type: dropdown
    id: epic
    attributes:
      label: "에픽"
      options:
        - "EP-01 저장소 기준선·CI·백로그 도구"
        - "EP-02 계약·어휘 단일 원본"
        - "EP-03 보안 규칙·Storage·인덱스"
        - "EP-04 접근 키·식별 백엔드"
        - "EP-05 트레이너 앱 기반"
        - "EP-06 출시 앱 규제 문구 정리·금지어 린트"
        - "EP-07 기능 플래그·관리자 화면"
        - "EP-08 동의·개인정보 핵심"
        - "EP-09 대기 회원"
        - "EP-10 SOAP Live·Review·확정"
        - "EP-11 신체조성·줄자 둘레"
        - "EP-12 타임라인·공통 시각화"
        - "EP-13 이관"
        - "EP-14 체형평가(정적 2D)"
        - "EP-15 O 자동 불러오기·비교·추이"
        - "EP-16 초대 코드·uid 승격"
        - "EP-17 회원 공유·리포트"
        - "EP-18 회원 앱 동의·권리와 전체 감사"
        - "EP-19 LiDAR 베타·BodyPathCore"
        - "EP-20 P2 확장"
        - "EP-21 판정 엔진·정책 운영"
        - "EP-22 센터 출시·Runner 트레이너 제거"
        - "EP-23 V2 보류"
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: "유형"
      options:
        - "story"
        - "chore"
        - "migration"
        - "test"
        - "docs"
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: "단계"
      options:
        - "P0"
        - "P1a"
        - "P1b"
        - "P2"
        - "P3"
        - "V2"
    validations:
      required: true
  - type: dropdown
    id: prio
    attributes:
      label: "우선순위(MoSCoW)"
      options:
        - "must"
        - "should"
        - "could"
        - "wont"
    validations:
      required: true
  - type: dropdown
    id: points
    attributes:
      label: "점수(소유자 검토·통합 노력)"
      description: "1=XS, 2=S, 3=M, 5=L. 8점은 계획 전에 나눈다."
      options:
        - "1 (size/XS)"
        - "2 (size/S)"
        - "3 (size/M)"
        - "5 (size/L)"
        - "8 (size/XL, 분할 필요)"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "영역"
      options:
        - "trainer-app"
        - "member-app"
        - "admin-web"
        - "functions"
        - "rules"
        - "storage"
        - "contracts"
        - "bodypath"
        - "ci"
        - "design"
        - "privacy"
        - "analytics"
        - "docs"
    validations:
      required: true
  - type: dropdown
    id: flag
    attributes:
      label: "기능 플래그"
      options:
        - "없음"
        - "soapV2"
        - "bodyComposition"
        - "bodyAssessment"
        - "memberShare"
        - "lidarBeta"
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: "PRD 추적 ID"
      description: "PRD에 존재하는 ID만(검증기가 확인). 새 ID를 만들지 않는다."
      placeholder: "F-SOAP-01.1, AC-SOAP-01.3, NFR-15, TR-04"
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: "배경"
      description: "PRD 절 링크와 요지 2~3줄. 원문 복사 금지."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "범위와 비범위"
      value: |
        **범위**
        -
        **비범위(담당 스토리)**
        -
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: "수정 경로(예상)"
      description: "파일·디렉터리 단위. 에이전트 지시서의 '수정 허용 경로'가 된다."
      placeholder: |
        trainer_app/Packages/TrainerKit/Sources/FeatureSOAP/** (신규)
        trainer_app/App/Localizable.xcstrings (수정)
  - type: textarea
    id: interface
    attributes:
      label: "인터페이스·데이터"
      description: "시그니처, 필드, JSON 예시(합성) 또는 V1-05/V1-06 절 링크"
  - type: textarea
    id: acceptance
    attributes:
      label: "수용 기준"
      description: "PRD AC 원문 인용 + AC-DF-NNN.k. 기준마다 테스트 종류(단위/규칙 에뮬레이터/e2e/교차 픽스처/UI/스냅샷/실기기/수동)."
      value: |
        | ID | 기준 | 테스트 종류 | 테스트 위치·이름 |
        |---|---|---|---|
        | AC-... | | | |
        | AC-DF-NNN.1 | | | |
    validations:
      required: true
  - type: textarea
    id: testdata
    attributes:
      label: "테스트 데이터(합성)"
      placeholder: "가상 회원 A·B, contracts/fixtures/soap_v2/minimal.json"
    validations:
      required: true
  - type: input
    id: deps
    attributes:
      label: "의존 스토리"
      description: "DF 키만. 외부 게이트는 아래 '게이트 영향'에 적는다."
      placeholder: "DF-015, DF-016"
  - type: textarea
    id: gates
    attributes:
      label: "게이트 영향"
      description: "외부 게이트는 코딩을 막지 않는다. 막히는 것(플래그 개방, 실데이터, 배포)만 적는다."
      placeholder: "G-04·G-09: soapV2 개방(DF-925)만 막음"
  - type: dropdown
    id: agent
    attributes:
      label: "담당"
      options:
        - "claude"
        - "codex"
        - "human"
    validations:
      required: true
  - type: checkboxes
    id: risk
    attributes:
      label: "위험 라벨(해당 항목 체크 → 소유자가 라벨 부착)"
      options:
        - label: "rules-change (firestore.rules·storage.rules·인덱스)"
        - label: "schema-change (Firestore 필드·contracts·schemas)"
        - label: "regulatory (사용자 노출 문구·규제 경계)"
        - label: "privacy-impact (동의·삭제·감사·로그·분석)"
        - label: "freeze-exception (Runner 내장 트레이너·trainer_ios 수정)"
        - label: "needs-device-test (실기기 확인 필요)"
  - type: checkboxes
    id: dor
    attributes:
      label: "준비 완료 정의(DoR) — V1-01"
      options:
        - label: "R1 PRD 추적 ID가 하나 이상 있다"
          required: true
        - label: "R2 수용 기준이 검증 가능하고 테스트 종류가 붙어 있다"
          required: true
        - label: "R3 선행 스토리가 Done이거나 같은 스프린트 앞순서다"
        - label: "R4 5점 이하다"
        - label: "R5 단계·플래그·영역·우선순위가 정해졌다"
          required: true
        - label: "R6 수정 경로가 정해졌고 병행 스토리와 겹치지 않는다"
        - label: "R7 스키마·규칙·계약·문구 영향을 표시했다"
        - label: "R8 합성 데이터 계획이 있다(실데이터 금지)"
          required: true
        - label: "R9 (에이전트 배정 시) 카드에 '에이전트 브리프' 절이 있고, tool/backlog/brief.mjs DF-NNN으로 생성한 작업 지시서(V1-T08)를 코멘트로 붙였다"
        - label: "R10 실기기·서명·콘솔 부분을 분리했다"
