name: D-FET CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

concurrency:
  group: dfet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.2  # 3.47 전환은 별도 작업(위젯 테스트·deprecation·FlutterFire SPM 정렬)
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags golden
      - run: flutter build web --release
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  functions-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --prefix functions
      - run: npm --prefix functions run lint
      - run: npm --prefix functions test
      - run: jq empty schemas/*.json
      - run: npm install --global firebase-tools
      - run: firebase emulators:exec --only firestore,storage --project dfet-rules-test "npm --prefix functions run test:rules"
      - run: printf '%s\n' 'INGEST_HMAC_KEYS={"e2e":"e2e-secret"}' > functions/.secret.local
      - run: firebase emulators:exec --only auth,functions,firestore,storage --project dfet-e2e "npm --prefix functions run test:e2e"

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin_web/package-lock.json
      - run: npm ci --prefix admin_web
      # admin_web/test/contracts.test.mjs가 functions/src를 불러오므로 functions 의존성도 설치한다
      - run: npm ci --prefix functions
      - run: npm --prefix admin_web run lint
      - run: npm --prefix admin_web run typecheck
      - run: npm --prefix admin_web test
      - run: npm --prefix admin_web run build

  ios-no-codesign:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.2  # 3.47 전환은 별도 작업(위젯 테스트·deprecation·FlutterFire SPM 정렬)
          cache: true
      - name: Runner has no trainer packages (NFR-01)
        run: 'test -f ios/Podfile && test -f ios/Runner.xcodeproj/project.pbxproj && ! grep -REn "TrainerCore|TrainerKit|BodyPathCore" ios/Podfile ios/Runner.xcodeproj/project.pbxproj'
      - run: flutter pub get
      - run: flutter test --tags golden
      - run: flutter build ios --release --no-codesign

  changes-ci:                  # DF-001. 경로 조건 job용 변경 감지(보조, 필수 체크 아님). DF-031(S05)이 migrations 출력을 더한다
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          # 기준 커밋을 못 찾으면(새 브랜치 첫 push 등) 안전하게 실행한다
          if ! files=$(git diff --name-only "$base" "$HEAD_SHA" 2>/dev/null); then
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -Eq '^(docs/|tool/backlog/|tool/lint/(doc-headers|test/doc-headers|test/issue-forms|test/fixtures/)|\.github/ISSUE_TEMPLATE/|\.github/pull_request_template\.md$|\.github/CODEOWNERS$|AGENTS\.md$|CLAUDE\.md$|\.github/workflows/ci\.yml$)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

  docs-and-backlog:            # DF-001, DF-002. 필수 체크 이름. 경로 밖이면 건너뜀 = 통과(ASM-S01-05)
    needs: changes-ci
    # changes-ci가 실패하면 건너뛰지 않고 실행한다(필수 체크가 검사 없이 통과되지 않게)
    if: ${{ !cancelled() && (needs.changes-ci.result != 'success' || needs.changes-ci.outputs.docs == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tool/lint/test/doc-headers.test.mjs tool/lint/test/issue-forms.test.mjs   # 이슈 폼 구조(AC-DF-001.4)
      - run: node tool/lint/doc-headers.mjs --links docs/v1          # 헤더 표준 + 상대 링크(AC-DF-001.1, .5)
      # DF-002 단계: 파일이 있을 때만 돈다. DF-002는 ci.yml을 고치지 않는다(SPRINT_01 §7.5, TL-01 §6)
      - name: Backlog issues.json drift (DF-002)
        if: hashFiles('tool/backlog/build_issues.mjs') != ''
        run: node tool/backlog/build_issues.mjs --check
      - name: Backlog validation (DF-002)
        if: hashFiles('tool/backlog/validate_backlog.mjs') != ''
        run: node tool/backlog/validate_backlog.mjs --prd docs/PRD_V1.md
      - name: Backlog script scenarios with fake gh (DF-002)
        if: hashFiles('tool/backlog/test/run.sh') != ''
        run: bash tool/backlog/test/run.sh
      - name: Backlog dry-run offline (DF-002)
        if: hashFiles('tool/backlog/create_backlog.sh') != ''
        run: bash tool/backlog/create_backlog.sh --dry-run --offline > /dev/null

  contracts:                  # DF-004. 필수 체크 이름. 워크플로 수준 paths 없음, 항상 실행(SPRINT_01 §5, ASM-S01-05)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tool/package-lock.json
      - run: npm ci --prefix tool
      # Node 22의 node --test는 디렉터리 인자를 받지 않아 글롭을 따옴표로 넘긴다. 순서는 10_TEST_PLAN §19.3과 같다
      - run: node --test 'tool/contracts/test/**/*.test.mjs'
      # ajv 메타 스키마(schemas/contracts-meta.schema.json) → 교차 검증 → 생성물 드리프트(AC-DF-004.2~.4)
      - run: node tool/contracts/generate.mjs --check

  static-guards:              # DF-011. 필수 체크 이름. 워크플로 수준 paths 없음, 항상 실행(V1-01 활성화 표, ASM-01-15 기준선 고정)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # 가드 자체 테스트: 가드별 위반 픽스처 → 해당 G번호로 실패, 기준선 줄 삭제·사유 없는 줄 → 실패(TC-DF011-01, -02)
      - run: bash tool/lint/test/static-guards.test.sh
      # G1~G9 grep 불변식. lib/ 결과는 tool/lint/static-guards.allow와 정확히 같아야 한다(AC-DF-011.1~.5)
      - run: bash tool/lint/static-guards.sh

  copy-lint:                  # DF-010(보고 모드) → DF-040(차단 모드). 필수 체크 이름. 워크플로 수준 paths 없음, 항상 실행
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # 저장소 변수. 비어 있으면 report(위반이 있어도 exit 0). DF-040에서 block으로 바꾼다(docs/v1/12 §7.9)
      COPY_LINT_MODE: ${{ vars.COPY_LINT_MODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tool/lint/test/prohibited-terms.test.mjs    # TC-DF010-01~05
      # 보고서를 job 로그와 Step Summary 표로 남긴다(AC-DF-010.2, AC-DF-010.6)
      - run: node tool/lint/prohibited-terms.mjs --mode="${COPY_LINT_MODE:-report}" --summary "$GITHUB_STEP_SUMMARY"
