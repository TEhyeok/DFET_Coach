name: trainer-app

# DF-008 (SPRINT_01 §7.4, V1-10 §19.4). No workflow-level `paths` filter: the workflow runs on every PR and
# the always-running `changes-trainer` job decides whether `trainer-app` runs. A job skipped by its `if`
# is reported as passing, so `trainer-app` can be a required check without blocking docs-only PRs
# (ASM-S01-05).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: trainer-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes-trainer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$PR_BASE_SHA"; else base="$PUSH_BEFORE_SHA"; fi
          if ! files=$(git diff --name-only "$base" "$HEAD_SHA" 2>/dev/null); then
            echo "diff against $base failed; running trainer-app to be safe"
            echo "app=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$files" | grep -Eq '^(trainer_app/|contracts/|\.github/workflows/trainer-app\.yml)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  trainer-app: # required-check name; skipped (= passing) when no trainer path changed
    needs: changes-trainer
    if: needs.changes-trainer.outputs.app == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: xcodebuild -version && swift --version && xcrun simctl list runtimes
      - name: Install pinned XcodeGen (ASM-S01-09)
        run: |
          V=$(cat trainer_app/.xcodegen-version)
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${V}/xcodegen.zip"
          echo "a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generated project is current (ADR-001, AC-DF-008.1)
        run: |
          xcodegen version
          xcodegen generate --spec trainer_app/project.yml --project trainer_app
          git diff --exit-code -- trainer_app/DFETTrainer.xcodeproj
      - name: TrainerCore stays platform-neutral (AC-DF-008.3)
        run: '! grep -REn "^import (UIKit|SwiftUI|SwiftData|Firebase)" trainer_app/Packages/TrainerCore/Sources'
      - name: Pure targets on macOS (TrainerCore)
        run: swift test --package-path trainer_app/Packages/TrainerCore
      - uses: actions/cache@v4
        with:
          path: trainer_app/.spm
          key: spm-${{ runner.os }}-${{ hashFiles('trainer_app/**/Package.resolved') }}
      - name: iPad simulator tests (App unit, TrainerKit packages, UI smoke)
        run: |
          set -o pipefail
          mkdir -p build
          UDID=$(bash trainer_app/scripts/ci_pick_ipad.sh)
          xcodebuild test -project trainer_app/DFETTrainer.xcodeproj -scheme DFETTrainer \
            -destination "id=${UDID}" -clonedSourcePackagesDirPath trainer_app/.spm \
            -skip-testing:DFETTrainerIntegrationTests -resultBundlePath build/sim.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee build/sim.log
      - name: Release build without plist (AC-DF-008.4)
        run: |
          set -o pipefail
          test ! -e trainer_app/Config/GoogleService-Info.plist
          xcodebuild build -project trainer_app/DFETTrainer.xcodeproj -scheme DFETTrainer \
            -configuration Release -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath trainer_app/.spm CODE_SIGNING_ALLOWED=NO | tee build/release.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: trainer-app-results
          path: |
            build/*.xcresult
            build/*.log
