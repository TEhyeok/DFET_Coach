<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fafafa"/>
    </linearGradient>
    <style>
      .bg { fill: #f5f5f7; }
      .sidebar { fill: #fbfbfd; }
      .card { fill: #ffffff; stroke: #e3e3e8; stroke-width: 1.4; filter: url(#shadow); }
      .card-flat { fill: #ffffff; stroke: #e3e3e8; stroke-width: 1.2; }
      .muted { fill: #f1f1f4; }
      .red { fill: #ff2d55; }
      .red-soft { fill: #ffe1e8; }
      .blue { fill: #007aff; }
      .blue-soft { fill: #e6f2ff; }
      .green { fill: #34c759; }
      .green-soft { fill: #e8f8ed; }
      .orange { fill: #ff9500; }
      .orange-soft { fill: #fff2df; }
      .border { stroke: #d8d8de; stroke-width: 1.2; fill: none; }
      .rule { stroke: #e5e5ea; stroke-width: 1.2; }
      .ink { stroke: #1d1d1f; stroke-width: 4; fill: none; stroke-linecap: round; opacity: 0.78; }
      .note { stroke: #007aff; stroke-width: 3.5; fill: none; stroke-linecap: round; opacity: 0.75; }
      .danger-line { stroke: #ff3b30; stroke-width: 4; fill: none; stroke-linecap: round; }
      .ok-line { stroke: #007aff; stroke-width: 4; fill: none; stroke-linecap: round; }
      .title { font: 850 42px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", sans-serif; fill: #1d1d1f; }
      .navtitle { font: 850 36px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", sans-serif; fill: #1d1d1f; }
      .h1 { font: 800 27px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", sans-serif; fill: #1d1d1f; }
      .h2 { font: 760 20px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", sans-serif; fill: #1d1d1f; }
      .body { font: 600 15px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", sans-serif; fill: #6e6e73; }
      .small { font: 650 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", sans-serif; fill: #7a7a82; }
      .tiny { font: 700 10px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", sans-serif; fill: #8e8e93; }
      .button { font: 800 15px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", sans-serif; fill: #ffffff; }
      .redtext { fill: #ff2d55; }
      .bluetext { fill: #007aff; }
      .greentext { fill: #34c759; }
      .orangetext { fill: #ff9500; }
